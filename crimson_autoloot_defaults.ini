[General]
; 新版独立插件读取这一组。F9 可临时开关，F10 呼出配置。
Enabled=1
DebugLog=0
ForegroundOnly=1
TriggerIntervalMs=650
InteractKey=E
ToggleHotkey=F9
ConfigHotkey=F10
Language=Auto
StrictVersionCheck=0

[Debug]
; 游戏更新后若启动崩溃，可临时把某一组 hook 改成 0 来定位。
InstallPromptTextHooks=1
InstallPromptBranchHook=1
RecordPromptBranch=1

[Features]
; 第一版只做这两个功能：地面拾取和摸尸体。
; 地面拾取当前覆盖交互类型 1、4、19。
GroundLoot=1
CorpseLoot=1

[ItemFilter]
